name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.23.0
          runtime: node@24
          cache: true
          cache-dependency-path: website/pnpm-lock.yaml
          install: false

      - name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata_url="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --jq '[.[] | select(.draft == false) | .assets[] | select(.name | endswith(".release.json"))][0].browser_download_url // empty'
          )"
          if [[ -n "$metadata_url" ]]; then
            curl --fail --location --silent --show-error \
              "$metadata_url" \
              --output website/src/data/release.json
          fi

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Check website
        working-directory: website
        run: pnpm run check

      - name: Build website
        working-directory: website
        run: pnpm run build

      - name: Validate website output
        working-directory: website
        run: pnpm run validate

      - name: Disable Jekyll processing
        run: touch website/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
